# Local development stack: Langfuse + Postgres + Qdrant.
# Not for production. Use `docker compose -f docker-compose.dev.yml up -d`.

services:
  postgres:
    image: postgres:16-alpine
    container_name: guardian-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: guardian
      POSTGRES_PASSWORD: guardian_dev_password
      POSTGRES_DB: guardian
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian -d guardian"]
      interval: 5s
      timeout: 5s
      retries: 10

  langfuse:
    image: langfuse/langfuse:2
    container_name: guardian-langfuse
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://guardian:guardian_dev_password@postgres:5432/guardian
      NEXTAUTH_SECRET: change-me-langfuse-nextauth-dev
      SALT: change-me-langfuse-salt-dev
      NEXTAUTH_URL: http://localhost:3000
      TELEMETRY_ENABLED: "false"
      LANGFUSE_DEFAULT_PROJECT_ROLE: ADMIN
    ports:
      - "3000:3000"

  qdrant:
    image: qdrant/qdrant:v1.12.4
    container_name: guardian-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  qdrant_data:
