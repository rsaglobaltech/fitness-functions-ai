name: arch-guardian

on:
  pull_request:
    branches: [main, develop]

concurrency:
  group: guardian-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  guardian:
    name: Architecture check (dogfooding)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # --base needs the merge-base in history

      - name: Run arch-guardian on this repository
        uses: ./
        with:
          fail-on: critical
