name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.7.19"

# Third-party actions are pinned by commit SHA (tag in the trailing comment);
# Dependabot keeps both up to date.

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  typecheck:
    name: Type-check (mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run mypy packages/engine/src

  test:
    name: Tests (pytest + coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
          enable-cache: true
      - run: uv python install ${{ env.PYTHON_VERSION }}
      - run: uv sync --all-packages --all-extras --frozen
      - run: uv run pytest
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore

  audit:
    name: Dependency audit (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          version: ${{ env.UV_VERSION }}
      - name: Export locked runtime dependencies
        run: >-
          uv export --frozen --no-dev --no-emit-workspace --all-packages --all-extras
          --format requirements-txt -o requirements-audit.txt
      - name: pip-audit
        run: uvx pip-audit==2.10.1 -r requirements-audit.txt --disable-pip --strict

  docker:
    name: Docker image (build, smoke test, scan)
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - name: Build image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          load: true
          push: false
          tags: arch-guardian:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run --rm arch-guardian:ci version
          # Repo owned by the runner UID, container runs as `guardian`: exercises safe.directory.
          docker run --rm -v "$PWD:/workspace" arch-guardian:ci analyze . --fail-on critical
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: arch-guardian:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: json
          output: trivy.json
          exit-code: "0"
      - name: Report vulnerabilities as annotations
        # Annotations are readable without repo access to job logs.
        run: |
          python3 - <<'PY'
          import json, sys
          vulns = [
              (r.get("Target", "?"), v)
              for r in json.load(open("trivy.json")).get("Results", [])
              for v in r.get("Vulnerabilities") or []
          ]
          for target, v in vulns:
              print(
                  f"::error title=Trivy {v['Severity']} {v['VulnerabilityID']}::"
                  f"{v['PkgName']} {v.get('InstalledVersion', '?')} -> "
                  f"{v.get('FixedVersion', '?')} ({target})"
              )
          print(f"{len(vulns)} fixable CRITICAL/HIGH vulnerabilities")
          sys.exit(1 if vulns else 0)
          PY
