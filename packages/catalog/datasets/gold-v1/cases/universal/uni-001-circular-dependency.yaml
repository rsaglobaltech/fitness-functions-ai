id: uni-001-circular-dependency
style: universal
language: python
label: violation
rule_id: circular_dependency
severity: critical
code:
  - path: src/billing/invoice.py
    content: |
      from src.users.account import Account

      class Invoice:
          def __init__(self, account: Account) -> None:
              self.account = account
  - path: src/users/account.py
    content: |
      from src.billing.invoice import Invoice

      class Account:
          def latest_invoice(self) -> Invoice:
              return Invoice(self)
rationale: |
  `billing.invoice` and `users.account` import each other. Beyond the
  obvious import-time risk in Python, this signals the two modules are not
  cleanly separated: extract the shared abstraction (e.g. an `AccountRef`
  value object) or move one direction of the relationship to a service.
source:
  origin: synthetic
tags: [circular_dependency, scc]
added_at: "2026-05-16"
