schema_version: "1.0"
project:
  name: hex-fixture
  language: typescript
architecture:
  style: hexagonal
  rule_pack_version: "1.0.0"
  strict_mode: true
layout:
  layers:
    domain:
      paths: ["src/domain/**"]
      can_depend_on: []
    application:
      paths: ["src/application/**"]
      can_depend_on: ["domain"]
    infrastructure:
      paths: ["src/infrastructure/**"]
      can_depend_on: ["domain", "application"]
