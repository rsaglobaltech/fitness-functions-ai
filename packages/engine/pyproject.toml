[project]
name = "arch-guardian-engine"
version = "0.0.1"
description = "Core engine for the architectural guardian"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [
    { name = "Full Stack Engineer | Oracle Certified Java Programmer", email = "alejandrosalas0891@gmail.com" },
]
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "pyyaml>=6.0.2",
    "jsonschema>=4.23.0",
    "anthropic>=0.39.0",
    "langchain>=0.3.0",
    "langgraph>=0.2.0",
    "langfuse>=2.50.0,<3.0.0",
    "tree-sitter>=0.23.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-java>=0.23.0",
    "networkx>=3.4",
    "httpx>=0.27.0",
    "rich>=13.9.0",
    "typer>=0.12.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/arch_guardian_engine"]
